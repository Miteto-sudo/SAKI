[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saki-opd-core"
version = "0.1.0"
description = "Framework-independent core reference implementation of SAKI"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[tool.setuptools.packages.find]
include = ["saki_opd*"]
